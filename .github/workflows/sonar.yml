name: SonarQube

on:
  push:
    branches: [next, main]
    paths: ['soapui-installer/**','soapui/**','.github/workflows/**']
  pull_request:
    branches: [next, main]
    paths: ['soapui-installer/**','soapui/**','.github/workflows/**']

jobs:
  build-and-analyze:
    name: Build and analyze (Maven + Sonar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 1) Build le module cible + ses dépendances locales (installe dans le cache Maven local)
      - name: Build reactor (install deps)
        run: |
          mvn -B -DskipTests -DskipITs -Dgpg.skip -pl soapui-installer -am install

      # 2) Lancer Sonar UNIQUEMENT sur le module, en pointant directement son POM
      - name: Sonar analysis (module-only)
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}   # ex: https://sonarqube.… ou https://sonarcloud.io
        run: |
          mvn -B -DskipTests -DskipITs -Dgpg.skip \
            -f soapui-installer/pom.xml \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.projectKey=com.smartbear.soapui:soapui-installer \
            -Dsonar.projectName="soapui-installer"
            # Si SonarCloud, ajoute:
            # -Dsonar.organization=<ton_org_key>
