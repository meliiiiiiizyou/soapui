name: SonarQube

on:
  push:
    branches: [next, main]
    paths:
      - 'soapui-installer/**'
      - 'soapui/**'                 # la dépendance locale
      - '.github/workflows/**'
  pull_request:
    branches: [next, main]
    paths:
      - 'soapui-installer/**'
      - 'soapui/**'
      - '.github/workflows/**'

jobs:
  build-and-analyze:
    name: Build and analyze (Maven + Sonar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build deps + analyze only soapui-installer
        env:
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          # Construit soapui-installer ET ses dépendances locales (-am),
          # sans changer de dossier, puis limite l'analyse Sonar au module.
          mvn -B -DskipTests -DskipITs -Dgpg.skip \
            -pl soapui-installer -am verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            -Dsonar.login="${{ secrets.SONAR_TOKEN }}" \
            -Dsonar.projectKey=com.smartbear.soapui:soapui-installer \
            -Dsonar.projectName="soapui-installer" \
            -Dsonar.projectBaseDir=soapui-installer
