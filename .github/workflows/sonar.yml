name: SonarQube

on:
  push:
    branches: [ "next" ]   # ta branche par défaut
  pull_request:
    branches: [ "next" ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # (optionnel mais plus rapide)
      #- name: Cache Sonar cache
      #  uses: actions/cache@v4
      #  with:
      #    path: ~/.sonar/cache
      #    key: ${{ runner.os }}-sonar
      #    restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze (Maven + Sonar)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # pour décorer les PR
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B -DskipTests -DskipITs -Dgpg.skip verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=soapui \
            -Dsonar.projectName=soapui
